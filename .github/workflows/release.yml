# A release from its tag (docs/releasing.md): a pushed tag vMAJOR.MINOR[-beta[.N]] that names headset.json's
# version runs every CI check on the tagged commit (skipped when its tree passed on main already), then makes
# the GitHub release overpressure downloads (python -m overpressure headset add phoenix): the tag's own
# message and the changelog section as its notes, the source zip (git archive: headset.json carries the
# commit and its time) and its checksum. No image, package or vendor file is attached (docs/distribution.md).
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # an earlier pass of the same tree

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The checkout's tag is a lightweight copy; the annotated tag carries the release's own words.
      - name: The tag itself
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - name: The tag names headset.json's version
        id: version
        run: |
          kind=$(python3 - "$GITHUB_REF_NAME" <<'EOF'
          import json, re, sys
          tag = sys.argv[1]
          version = json.load(open("headset.json"))["version"]
          if not re.fullmatch(r"v\d+\.\d+(-beta(\.[1-9]\d*)?)?", tag) or tag != "v" + version:
              sys.exit(f"{tag} is not v{version} (headset.json), or not vMAJOR.MINOR[-beta[.N]]")
          print("prerelease" if "-beta" in tag else "release")
          EOF
          )
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "name=phoenix-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Annotated, on main
        run: |
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || { echo "::error::$GITHUB_REF_NAME is not annotated: git tag -a"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Notes and changelog
        run: |
          {
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo
            uvx git-cliff@2.14.2 --latest --strip header
          } > notes.md
          uvx git-cliff@2.14.2 --output CHANGELOG.md
          cat notes.md
      - name: The source zip
        run: |
          name=${{ steps.version.outputs.name }}
          git archive --format=zip --prefix="$name/" --add-file=CHANGELOG.md -o "$name.zip" "$GITHUB_REF_NAME"
          sha256sum "$name.zip" > "$name.zip.sha256"
          unzip -p "$name.zip" "$name/headset.json"
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=${{ steps.version.outputs.name }}
          flag=""
          [ "${{ steps.version.outputs.kind }}" = prerelease ] && flag=--prerelease
          gh release create "$GITHUB_REF_NAME" $flag --verify-tag \
            --title "PICO 4 ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            "$name.zip" "$name.zip.sha256"
